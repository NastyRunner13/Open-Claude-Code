# Open Claude Code — Example Configuration
# Copy to occ.yml or .occ/config.yml

# Model (default: claude-sonnet-4-20250514)
model: "claude-sonnet-4-20250514"
# model: "openrouter/anthropic/claude-sonnet-4"  # OPENROUTER_API_KEY
# model: "groq/llama-3.3-70b-versatile"          # GROQ_API_KEY; groq/ prefix required
# model: "ollama/qwen2.5-coder"                  # native /api/chat; no API key
#
# Tip: `occ provider wizard` remembers the working model in
# ~/.occ/profiles.yml (never keys). Plain `occ` loads the active profile;
# this file still wins for the keys it sets. `occ --profile <name>`
# overrides once. See `occ provider list|show|save|use|models`.
max_tokens: 16000
# Ollama context window. Default 32768. Override with OCC_OLLAMA_NUM_CTX.
# num_ctx: 32768
max_tool_output: 10000

# OpenAI-compatible endpoint (Together, vLLM, …). OpenRouter does not need this:
# occ --model openrouter/<vendor>/<model> uses https://openrouter.ai/api/v1.
# base_url: "https://api.together.xyz/v1"

# Mode: ask | plan | agent
mode: "agent"

# Skip all approval prompts (dangerous!)
skip_approval: false

# Capability policy. Denied tools remain blocked even when approvals are skipped.
permission_mode: "workspace-write"  # read-only | workspace-write | full-access
disallowed_tools: []  # Supports names or patterns, e.g. ["mcp_prod_*"]

# Runtime safety
workspace_roots:
  - "."
writable_roots:
  - "."
shell_policy: "workspace-write"  # read-only | workspace-write | full-access

# Tools that auto-approve without prompting
auto_approve:
  - read_file
  - list_directory
  - find_files
  - grep_search
  - web_search
  - read_url
  - load_skill
  - git_status
  - git_diff
  - git_log
  - git_branch
  - wait_agent

# Skill directories (searched in order)
skills_dirs:
  - "~/.occ/skills"
  - ".occ/skills"

# Plugin directories
plugins_dirs:
  - "~/.occ/plugins"
  - ".occ/plugins"

# MCP (Model Context Protocol) servers
# mcp_servers:
#   - name: filesystem
#     command: "npx"
#     args: ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/dir"]
#   - name: github
#     command: "npx"
#     args: ["-y", "@modelcontextprotocol/server-github"]
#     env:
#       GITHUB_TOKEN: "ghp_..."

# Context management
max_context_tokens: 100000
context_compaction: true

# Durable local transcripts and execution ledger. Use `occ --resume <session-id>`
# to continue a saved conversation.
persist_sessions: true
sessions_dir: ".occ/sessions"
persist_snapshots: true
snapshots_dir: ".occ/snapshots"

# Public web access is validated before requests and cached locally. Empty
# allowlist means any public domain is allowed; private/local addresses remain blocked.
network_enabled: true
web_allowed_domains: []
web_blocked_domains: []
web_cache_dir: ".occ/cache/web"
web_cache_ttl_seconds: 3600
web_max_response_bytes: 1000000

# Provider resilience and child-agent limits
provider_max_retries: 2
provider_retry_base_delay: 0.5
max_turns: 100
agents_dirs:
  - ".occ/agents"
personas_dirs:
  - ".occ/personas"
  - "~/.occ/personas"

# Cost. Prices are USD per million tokens. `/cost` prints "price unknown"
# for unlisted hosted models instead of $0.00. Ollama is free.
# max_budget_usd: 5.0
# model_prices:
#   my-local-model:
#     input: 0.0
#     output: 0.0
#     cache_read: 0.0
#     cache_creation: 0.0

